<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <div class="header">
            <div class="h-logo">
                <h3>Quản lí nhân sự</h3>
                <nav>
                    <ul>
                        <li>
                            <a href='#'>Trang chủ</a>

                        </li>
                        <li>
                            <a href='#'>Liên hệ</a>
                    </ul>
                </nav>
            </div>

            <div class="h-navbar">
                <input type="search" class='form-control' placeholder="Tìm kiếm...">
                <button type="submit" class="btn btn-dark border">Tìm</button>
            </div>

        </div>
        <!-- end header -->

        <div class="main">
            <div class="m-start">
                <h3>Danh sách nhân sự</h3>
                <!-- /// bôtrap nv button model -->
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addEmployeeModal">
                    + Thêm mới
                </button>
            </div>

            <div id="table-container" class="mt-4">
                <!-- render dữ liệu ở đây -->
                 
            </div>
        </div>
        <!-- end main -->



        <!-- pop up mẫu -->
        <div class="modal fade" id="addEmployeeModal" tabindex="-1" aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered" style="max-width: 700px;">

                <div class="modal-content">
                    <div class="modal-header">
                        <h4 class="modal-title">Thêm nhân sự mới</h4>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <div class="modal-body">
                        <form id="addEmployeeForm">
                            <div class="error alert alert-danger d-none  " id="error"></div>
                            <div class="row     mb-3">
                                <div class="col-6">
                                    <label class="form-label">Họ tên</label>
                                    <input type="text" class="form-control" id="name">
                                </div>

                                <div class="col-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" id="email">
                                </div>
                            </div>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <label class="form-label">Số điện thoại</label>
                                    <input type="tel" class="form-control"  id="phone">
                                </div>

                                <div class="col-6">
                                    <label class="form-label">Vị trí</label>
                                    <select class="form-select" id="position">
                                        <option value="">-- Chọn vị trí --</option>
                                        <option value="Nhân viên">Nhân Viên</option>
                                        <option value="Quản lý">Quản Lý</option>
                                        <option value="Giám đốc">Giám Đốc</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label d-block">Giới tính</label>
                                <div class="form-check form-check-inline">
                                    <input type="radio" name="gender" id="male" class="form-check-input">
                                    <label for="male" class="form-check-label">Nam</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input type="radio" name="gender" id="female" class="form-check-input">
                                    <label for="female" class="form-check-label">Nữ</label>
                                </div>
                            </div>

                            <div class="modal-footer justify-content-end gap-2">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                                <button type="submit" class="btn btn-success">Lưu</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>



        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
        <script src="data.js"></script>
        <script src="list.js"></script>

</body>

</html>
