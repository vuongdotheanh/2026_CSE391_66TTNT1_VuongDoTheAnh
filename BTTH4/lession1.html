<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="lession1.css">
</head>
<body>
    <header>
        <form action="">
        <input type="text" id ="name" placeholder="Nhập tên...">
        <input type="number" id="score" placeholder="Điểm(0-10)">
        <button id = "btn-add">Thêm</button>
        </form>
    </header>
    <!-- end header -->
     <main>
        <!-- search -->
        
         
         <div>
            <select id="filter">
            <option value="all">Lọc theo xếp loại</option>
            <option value="giỏi">Giỏi</option>
            <option value="khá">Khá</option>
            <option value="yếu">Yếu</option>
         </select>
         <input type="search" id ="search" placeholder="Nhập tên cần tìm...">
         <button id="btn-search">Tìm Kiếm</button>
         </div>
        <table border="1px" >
            <thead>
                <tr>
                <th>STT</th>
                <th>Họ và tên</th>
                <th id ="sort-diem">Điểm <span id="sort-icon"></span></th>
                <th>Xếp loại</th>
                <th>Thao tác
                </th>
                </tr>
            </thead>
            <tbody id="tbody">
                
            </tbody>
        </table>
        <div id="thong-ke">
            <p id="no-rs">Không thấy kết quả</p>
            <p>Tổng số sinh viên: <span id="tong-sv">0</span>
            </p>
            <p>DTB: <span id="dtb">0.0</span></p>
        </div>
     </main>

     <script src="lession1.js"></script>
</body>
</html>
