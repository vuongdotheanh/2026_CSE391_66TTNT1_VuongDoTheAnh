<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký Sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h3>Student Management</h3>
        </div>

        <div class="form-body">
            <h2 class="title">Đăng ký/Sửa thông tin Sinh viên</h2>

            <form id="student-form">
                
                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="fullname" class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="fullname">
                    </div>
                    <div class="col-md-6">
                        <label for="msv" class="form-label">Mã sinh viên</label>
                        <input type="text" class="form-control" id="msv" placeholder="VD: SV001">
                    </div>
                </div>

                <div class="row mb-4">
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email">
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Số điện thoại</label>
                        <input type="tel" class="form-control" id="phone">
                    </div>
                </div>

                <div class="row mb-5">
                    <div class="col-md-6">
                        <label for="study" class="form-label">Ngành học</label>
                        <select class="form-select" id="study">
                            <option value="">Chọn ngành</option>
                            <option value="IT">IT</option>
                            <option value="Design">Design</option>
                            <option value="Business">Business</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label d-block">Giới tính</label>
                        <div class="form-check form-check-inline mt-2">
                            <input class="form-check-input" type="radio" name="gender" id="genderMale" value="Nam">
                            <label class="form-check-label" for="genderMale">Nam</label>
                        </div>
                        <div class="form-check form-check-inline mt-2">
                            <input class="form-check-input" type="radio" name="gender" id="genderFemale" value="Nữ">
                            <label class="form-check-label" for="genderFemale">Nữ</label>
                        </div>
                    </div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-primary" id="btn-save">Lưu thông tin</button>
                    <button type="button" class="btn btn-secondary" id="btn-cancel">Hủy</button>
                </div>
            </form>
        </div>
    </div>
<script src="register.js"></script>
</body>
</html>
