<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>
    <div class="small-container">
        <div class="header">
            <h3>New Employee</h3>
            <span class="close-icon">&times;</span>
        </div>

        <div class="main">

            <div class="name">
                <form action="">
                    <label for="name">Name</label><br>
                    <input type="text" id="" name="name">
                </form>
            </div>
            <div class="email">
                <form action="">
                    <label for="email">Email</label><br>
                    <input type="email" id="" name=""><br>
                </form>
            </div>
            <div class="phone">
                <form action="">
                    <label for="phone">Phone</label>
                    </label><br>
                    <input type="text">
                </form>
            </div>
            <div class="position">
                <form action="">
                    <label for="position">
                        Position
                    </label>
                    <select name="position" id="positon">
                        <option value="position">-- Select Positon --</option>
                        <option value="position">Staff</option>
                        <option value="position">Manager</option>
                        <option value="position">CEO</option>
                    </select>

                </form>

            </div>
            <div class="sex">
                <form action="">
                    <label for="sex">Sex</label><br>
                    <input type="radio" value="male">
                    <label for="male">Male</label>
                    <input type="radio" value="famele">
                    <label for="famele">Famele</label>
                </form>
            </div>
        </div>
        <footer>
            <button class="save">Save</button>
            <button class="cancel">
                Cancel                
            </button>
        </footer>
    </div>
</body>

</html>
